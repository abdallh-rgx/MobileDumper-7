name: Build MobileDumper-7 (Android)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Shared Library (NDK r27c)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja & CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake

      - name: Setup Android NDK r27c
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true
          local-cache: true

      - name: Build Android Shared Library (.so)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x build.sh
          ./build.sh --platform android --target lib --build release --arch arm64

      - name: Locate and Stage .so File
        run: |
          mkdir -p output_so
          find builds/ -type f -name "*.so" -exec cp {} output_so/ \;
          ls -la output_so/

      - name: Upload Android .so Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libMobileDumper-7-arm64
          path: output_so/*.so
