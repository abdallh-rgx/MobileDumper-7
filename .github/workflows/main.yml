name: Build MobileDumper-7 (Android)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Shared Library (NDK r27c)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake wget unzip

      - name: Cache NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /opt/android-ndk-r27c
          key: android-ndk-r27c-linux-v1

      - name: Download NDK r27c
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip -d /opt
          rm -f android-ndk-r27c-linux.zip

      - name: Export NDK Environment
        run: |
          echo "ANDROID_NDK_HOME=/opt/android-ndk-r27c" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=/opt/android-ndk-r27c" >> $GITHUB_ENV
          echo "NDK_HOME=/opt/android-ndk-r27c"        >> $GITHUB_ENV
          echo "/opt/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Verify NDK Installation
        run: |
          echo "==> NDK path: $ANDROID_NDK_HOME"
          ls -la "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/" | head -n 20
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"   || { echo "clang missing"; exit 1; }
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" || { echo "clang++ missing"; exit 1; }
          test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"               || { echo "toolchain file missing"; exit 1; }
          echo "==> NDK OK"

      - name: Verify build.sh
        run: |
          ls -la build.sh
          head -n 40 build.sh

      - name: Build Android Shared Library (.so)
        run: |
          chmod +x build.sh
          ./build.sh --platform android --target lib --build release --arch arm64

      - name: Locate and Stage .so File
        run: |
          mkdir -p output_so
          find builds/ -type f -name "*.so" -exec cp -v {} output_so/ \;
          echo "==> Staged files:"
          ls -la output_so/

      - name: Upload Android .so Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libMobileDumper-7-arm64
          path: output_so/*.so
          if-no-files-found: error
